name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行测试
        working-directory: app
        run: python -m unittest discover -s tests -v

      - name: 导入冒烟测试
        working-directory: app
        run: |
          python -c "import aggregate, capture, config, http_client, llm_client, logging_setup, main, overview, report, skill_server, store, upload; print('all modules import OK')"

  lint:
    name: 静态检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 编译检查（语法）
        working-directory: app
        run: python -m compileall -q . -x "(dist|build|__pycache__)"

      - name: 安装 ruff
        run: pip install ruff

      - name: ruff 检查
        working-directory: app
        run: ruff check . --select E9,F63,F7,F82,F401,F811,F841
